# Triggered by the tag that `npm run release` creates and pushes. release-it
# handles version, changelog, commit, tag and push locally; everything that
# touches the registry happens here.
#
# Publishing uses an npm trusted publisher (OIDC), so there is no token stored
# anywhere. Mirrors @bloomscorp/bloomsight.js, which already runs this way.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # cut the GitHub release
  id-token: write     # mints the OIDC token npm trusts, and signs provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Required so npm knows which registry the OIDC token is for. No
          # NODE_AUTH_TOKEN is set anywhere — see the publish step.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and Node 22 bundles an older one.
      - name: Upgrade npm for OIDC publishing
        run: |
          npm install -g npm@^11.5.1
          npm -v

      - run: npm ci

      # The same gates as CI. A tag must never publish something that would not
      # have passed on main.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify the built package is loadable
        run: npm run verify:package

      # The tag and package.json must agree, or npm serves a version the git
      # history does not describe.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
